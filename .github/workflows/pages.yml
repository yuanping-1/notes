# 推送到 main 后自动构建并发布到 GitHub Pages。
#
# 不需要 npm install：站点零第三方依赖，装个 Node 就能构建。
# 构建脚本会把产物写到临时目录再改名成交 dist/，所以这里的 path: dist 拿到的是完整产物。
name: Build and deploy to Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次重新部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署；不取消进行中的那次，避免线上出现半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建站点
        run: node src/build.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时若仓库还没开启 Pages，尝试自动开启，省掉手动进设置页
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
